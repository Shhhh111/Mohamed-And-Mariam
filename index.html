  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 50%, #6c5b7b 100%);
        }

        .container {
            width: 100%;
            height: 100%;
            background: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Login Screen */
        .login-screen {
            padding: 20px;
            text-align: center;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #ff6b9d;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .user-selection {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .user-card {
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            padding: 25px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            border: 3px solid transparent;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
        }

        .user-card.selected {
            border-color: #fff;
            transform: scale(1.05);
        }

        .user-card h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .user-card p {
            font-size: 14px;
            opacity: 0.9;
        }

        .user-card.mariam {
            background: linear-gradient(135deg, #ffa8c5 0%, #ff6b9d 100%);
        }

        .password-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ff6b9d;
            border-radius: 15px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            display: none;
        }

        .password-input.show {
            display: block;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Chat Screen */
        .chat-screen {
            display: none;
            height: 100%;
            width: 100%;
        }

        .chat-screen.active {
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 3px solid white;
        }

        .chat-info {
            flex: 1;
        }

        .chat-info h2 {
            font-size: 20px;
            margin-bottom: 3px;
        }

        .chat-info p {
            font-size: 12px;
            opacity: 0.9;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            align-items: flex-end;
        }

        .message.received {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }

        .message-image {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 5px;
            cursor: pointer;
        }

        .message-file {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 10px;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .message.received .message-file {
            background: #f0f0f0;
        }

        .delete-btn {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
        }

        .message.received .delete-btn {
            background: #ffebee;
            color: #e53e3e;
        }

        .message.selected .message-bubble {
            border: 3px solid #ff6b9d;
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.5);
        }

        .admin-controls {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 1500;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 350px;
        }

        .admin-controls.show {
            display: flex;
        }

        .admin-control-btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-control-btn.delete {
            background: linear-gradient(135deg, #e53e3e 0%, #c62828 100%);
        }

        .admin-control-btn.cancel {
            background: linear-gradient(135deg, #888 0%, #666 100%);
        }

        .selection-mode-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            color: white;
            padding: 15px;
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 1600;
        }

        .selection-mode-header.show {
            display: flex;
        }

        .selection-mode-header button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Input Area */
        .input-area {
            background: white;
            padding: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .attachment-preview {
            display: none;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 10px;
            position: relative;
        }

        .attachment-preview.show {
            display: block;
        }

        .preview-image {
            max-width: 100px;
            max-height: 100px;
            border-radius: 8px;
        }

        .preview-file {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .remove-preview {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #e53e3e;
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
        }

        .input-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .attach-btn {
            background: #f0f0f0;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .attach-btn:hover {
            background: #e0e0e0;
        }

        .message-form {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        .message-input:focus {
            border-color: #ff6b9d;
        }

        .send-btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        /* Profile Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 80%;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #ff6b9d;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .profile-edit {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .profile-edit label {
            font-weight: bold;
            color: #333;
        }

        .profile-edit input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        .save-btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 2000;
            animation: toastSlide 0.3s ease;
        }

        @keyframes toastSlide {
            from {
                transform: translateX(400px);
            }
            to {
                transform: translateX(0);
            }
        }

        .toast.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        input[type="file"] {
            display: none;
        }

        /* Music Player Sidebar */
        .music-sidebar {
            position: fixed;
            left: -400px;
            top: 0;
            width: 400px;
            height: 100%;
            background: white;
            box-shadow: 2px 0 20px rgba(0,0,0,0.3);
            transition: left 0.3s ease;
            z-index: 3000;
            display: flex;
            flex-direction: column;
        }

        .music-sidebar.show {
            left: 0;
        }

        .music-header {
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .music-header h2 {
            font-size: 20px;
        }

        .close-music {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }

        .music-iframe-container {
            flex: 1;
            overflow: hidden;
        }

        .music-iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .music-controls {
            background: #f5f5f5;
            padding: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .now-playing {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            text-align: center;
        }

        .now-playing h3 {
            color: #ff6b9d;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .now-playing p {
            color: #666;
            font-size: 14px;
        }

        .music-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2999;
        }

        .music-overlay.show {
            display: block;
        }

        .music-notification {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 2000;
            animation: slideUp 0.3s ease;
            max-width: 300px;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .music-notification.show {
            display: block;
        }

        .music-notification h4 {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .music-notification p {
            font-size: 12px;
            opacity: 0.9;
        }

        .music-sidebar {
            width: 100%;
            left: -100%;
        }

        .music-sidebar.show {
            left: 0;
        }
        img{
            border-radius: 50%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>

  <div class="toast" id="toast"></div><!-- Music Player Sidebar -->
  <div class="music-overlay" id="musicOverlay" onclick="closeMusicPlayer()"></div>
  <div class="music-sidebar" id="musicSidebar">
   <div class="music-header">
    <h2>🎵 قائمة الأغاني</h2><button class="close-music" onclick="closeMusicPlayer()">×</button>
   </div>
   <div class="music-iframe-container"><iframe id="musicIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen> </iframe>
   </div>
   <div class="music-controls">
    <div class="now-playing" id="nowPlaying" style="display: none;">
     <h3>🎵 الآن يتم التشغيل</h3>
     <p id="currentSongTitle">لا توجد أغنية</p>
    </div>
   </div>
  </div><!-- Music Notification -->
  <div class="music-notification" id="musicNotification">
   <h4>🎵 يتم تشغيل أغنية</h4>
   <p id="musicNotificationText">جاري التحميل...</p>
  </div><!-- Selection Mode Header -->
  <div class="selection-mode-header" id="selectionModeHeader">
   <div><span id="selectedCount">0</span> محدد
   </div><button onclick="cancelSelection()">إلغاء</button>
  </div><!-- Admin Controls -->
  <div class="admin-controls" id="adminControls"><button class="admin-control-btn" onclick="editSelectedMessages()"> ✏️ تعديل الرسائل المحددة </button> <button class="admin-control-btn delete" onclick="deleteSelectedMessages()"> 🗑️ حذف الرسائل المحددة </button> <button class="admin-control-btn cancel" onclick="cancelSelection()"> ❌ إلغاء </button>
  </div>
  <script>
        // JSONBin Configuration
        const JSONBIN_API_KEY = '$2a$10$EVEgnKcuZEoujGa1B3HQmuU7C3Eh6NfJFdYR9IH0r1mQR3UAc2SU2';
        const JSONBIN_BIN_ID = '69127ce1ae596e708f515e36';
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

        // Admin Password
        const ADMIN_PASSWORD = 'ipMohamedHany001010';

        // Current User
        let currentUser = null;
        let selectedLoginUser = null;
        let currentAttachment = null;
        let isLoading = false;
        let isSelectionMode = false;
        let selectedMessages = new Set();
        let allData = {
            messages: [],
            profiles: {
                mohamed: {
                    name: 'محمد',
                    emoji: '',
                    status: 'متصل الآن',
                    lastSeen: new Date().toISOString(),
                    imageUrl: 'https://i.ibb.co/XrXwgWRy/Mohamed2.jpg',
                    imageData: ''
                },
                mariam: {
                    name: 'مريم',
                    emoji: '',
                    status: 'متصلة الآن',
                    lastSeen: new Date().toISOString(),
                    imageUrl: 'https://i.ibb.co/tP1yy4H0/image.png',
                    imageData: ''
                }
            },
            passwords: {
                mohamed: 'ipMohamedHany001010',
                mariam: ''
            },
            notificationSettings: {
                mohamed: {
                    enabled: true,
                    timestamp: '2024-01-01T00:00:00.000Z'
                },
                mariam: {
                    enabled: true,
                    timestamp: '2024-01-01T00:00:00.000Z'
                }
            },
            musicPlayer: {
                playlistUrl: 'https://www.youtube.com/watch?v=YQ7SxFTZJW4&list=RDMMYQ7SxFTZJW4&index=1',
                currentSong: null,
                isPlaying: false
            },
            apkFile: 'https://drive.google.com/file/d/144QjVs3ESxcC884nbzbb_MOSf5f_5Ba9/view?usp=sharing'
        };

        // Initialize App
        async function initApp() {
            console.log('🚀 بدء تحميل التطبيق...');
            
            const loaded = await loadData();
            
            if (!loaded) {
                console.log('⚠️ فشل التحميل - استخدام البيانات الافتراضية');
                showToast('تحذير: لم يتم الاتصال بالخادم. استخدام البيانات المحلية.');
            }

            const savedUser = localStorage.getItem('lastLoggedInUser');
            if (savedUser) {
                try {
                    const userData = JSON.parse(savedUser);
                    if (userData.user === 'mariam') {
                        console.log('✅ تسجيل دخول تلقائي لمريم');
                        currentUser = 'mariam';
                        showChatScreen();
                    }
                } catch (e) {
                    console.error('خطأ في قراءة بيانات التسجيل:', e);
                }
            }
        }

        // Load Data from JSONBin - دمج البيانات مع الحفاظ على كل شيء
        async function loadData() {
            if (isLoading) return false;
            isLoading = true;

            try {
                console.log('📥 جاري تحميل البيانات من JSONBin...');
                
                const response = await fetch(JSONBIN_URL + '/latest', {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': JSONBIN_API_KEY,
                        'X-Bin-Meta': 'false'
                    }
                });

                console.log('📡 حالة الاستجابة:', response.status);

                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ تم تحميل البيانات بنجاح:', data);
                    
                    let jsonBinData = data.record || data;
                    
                    // دمج البيانات - الحفاظ على البيانات القديمة وإضافة الجديدة
                    if (jsonBinData.messages && Array.isArray(jsonBinData.messages)) {
                        allData.messages = jsonBinData.messages;
                    }
                    
                    // دمج بيانات الملفات الشخصية مع الحفاظ على الصور
                    if (jsonBinData.profiles) {
                        for (let user in jsonBinData.profiles) {
                            if (!allData.profiles[user]) {
                                allData.profiles[user] = {};
                            }
                            // دمج البيانات الجديدة مع الحفاظ على الصور إذا كانت موجودة
                            allData.profiles[user] = {
                                ...allData.profiles[user],
                                ...jsonBinData.profiles[user]
                            };
                            
                            // التأكد من وجود الصور الصحيحة
                            if (user === 'mohamed' && !allData.profiles[user].imageUrl) {
                                allData.profiles[user].imageUrl = 'https://i.ibb.co/XrXwgWRy/Mohamed2.jpg';
                            }
                            if (user === 'mariam' && !allData.profiles[user].imageUrl) {
                                allData.profiles[user].imageUrl = 'https://i.ibb.co/tP1yy4H0/image.png';
                            }
                        }
                    }
                    
                    // دمج بيانات كلمات المرور
                    if (jsonBinData.passwords) {
                        allData.passwords = {
                            ...allData.passwords,
                            ...jsonBinData.passwords
                        };
                    }
                    
                    // دمج إعدادات الإخطارات
                    if (jsonBinData.notificationSettings) {
                        allData.notificationSettings = {
                            ...allData.notificationSettings,
                            ...jsonBinData.notificationSettings
                        };
                    }
                    
                    // دمج إعدادات الموسيقى
                    if (jsonBinData.musicPlayer) {
                        allData.musicPlayer = {
                            ...allData.musicPlayer,
                            ...jsonBinData.musicPlayer
                        };
                    } else {
                        if (!allData.musicPlayer) {
                            allData.musicPlayer = {
                                playlistUrl: 'https://www.youtube.com/watch?v=YQ7SxFTZJW4&list=RDMMYQ7SxFTZJW4&index=1',
                                currentSong: null,
                                isPlaying: false
                            };
                        }
                    }
                    
                    // دمج أي بيانات إضافية
                    if (jsonBinData.apkFile) {
                        allData.apkFile = jsonBinData.apkFile;
                    }
                    
                    if (currentUser) {
                        renderMessages();
                        updateHeader();
                    }
                    
                    isLoading = false;
                    return true;
                } else {
                    const errorText = await response.text();
                    console.error('❌ خطأ في التحميل:', response.status, errorText);
                    isLoading = false;
                    return false;
                }
            } catch (error) {
                console.error('❌ خطأ في الاتصال:', error);
                isLoading = false;
                return false;
            }
        }

        // Save Data to JSONBin - حفظ البيانات مع الحفاظ على كل شيء
        async function saveData() {
            try {
                console.log('💾 جاري حفظ البيانات في JSONBin...');
                console.log('📋 البيانات المحفوظة:', allData);
                
                const dataToSave = {
                    messages: allData.messages || [],
                    profiles: allData.profiles || {},
                    passwords: allData.passwords || {},
                    notificationSettings: allData.notificationSettings || {},
                    musicPlayer: allData.musicPlayer || {},
                    apkFile: allData.apkFile || 'https://drive.google.com/file/d/144QjVs3ESxcC884nbzbb_MOSf5f_5Ba9/view?usp=sharing'
                };
                
                const response = await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify(dataToSave)
                });

                console.log('📡 حالة الحفظ:', response.status);

                if (response.ok) {
                    console.log('✅ تم الحفظ بنجاح في JSONBin');
                    return true;
                } else {
                    const errorText = await response.text();
                    console.error('❌ خطأ في الحفظ:', response.status, errorText);
                    throw new Error('Failed to save data');
                }
            } catch (error) {
                console.error('❌ خطأ في حفظ البيانات:', error);
                showToast('حدث خطأ في حفظ البيانات ❌');
                return false;
            }
        }

        // User Selection
        function selectUser(user) {
            selectedLoginUser = user;
            document.querySelectorAll('.user-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.target.closest('.user-card').classList.add('selected');

            const passwordInput = document.getElementById('passwordInput');
            const errorMessage = document.getElementById('errorMessage');

            const storedPassword = allData.passwords?.[user];
            const defaultPassword = user === 'mohamed' ? ADMIN_PASSWORD : null;
            const requiresPassword = storedPassword || defaultPassword;

            if (requiresPassword) {
                passwordInput.classList.add('show');
                passwordInput.focus();
            } else {
                passwordInput.classList.remove('show');
            }

            errorMessage.classList.remove('show');
        }

        // Login
        function login() {
            if (!selectedLoginUser) {
                showToast('الرجاء اختيار حساب أولاً');
                return;
            }

            const errorMessage = document.getElementById('errorMessage');
            const passwordInput = document.getElementById('passwordInput');

            const storedPassword = allData.passwords?.[selectedLoginUser];
            const defaultPassword = selectedLoginUser === 'mohamed' ? ADMIN_PASSWORD : null;
            const requiredPassword = storedPassword || defaultPassword;

            if (requiredPassword) {
                const enteredPassword = passwordInput.value;
                if (enteredPassword !== requiredPassword) {
                    errorMessage.classList.add('show');
                    return;
                }
            }

            currentUser = selectedLoginUser;

            localStorage.setItem('lastLoggedInUser', JSON.stringify({
                user: currentUser,
                timestamp: new Date().toISOString()
            }));

            allData.profiles[currentUser].lastSeen = new Date().toISOString();
            saveData();

            showChatScreen();
        }

        // Logout
        function logout() {
            if (currentUser) {
                allData.profiles[currentUser].lastSeen = new Date().toISOString();
                saveData();
            }

            currentUser = null;
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('chatScreen').classList.remove('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').classList.remove('show');
            document.querySelectorAll('.user-card').forEach(card => {
                card.classList.remove('selected');
            });
        }

        // Show Chat Screen
        function showChatScreen() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.add('active');
            updateHeader();
            renderMessages();
            
            // Show admin select button for Mohamed
            if (currentUser === 'mohamed') {
                document.getElementById('adminSelectBtn').style.display = 'block';
            }
            
            setInterval(loadData, 3000);
        }

        // Update Header
        function updateHeader() {
            const otherUser = currentUser === 'mohamed' ? 'mariam' : 'mohamed';
            const profile = allData.profiles[otherUser];

            const headerPic = document.getElementById('headerProfilePic');
            
            const imageSource = profile.imageData || profile.imageUrl;
            if (imageSource) {
                headerPic.innerHTML = `<img src="${imageSource}" alt="${profile.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" onerror="this.style.display='none'; this.parentElement.textContent='${profile.emoji}';">`;
            } else {
                headerPic.textContent = profile.emoji;
            }
            
            document.getElementById('headerName').textContent = profile.name;

            const lastSeen = new Date(profile.lastSeen);
            const now = new Date();
            const diffMinutes = Math.floor((now - lastSeen) / 60000);

            let statusText = '';
            if (diffMinutes < 1) {
                statusText = 'متصل الآن 💚';
            } else if (diffMinutes < 60) {
                statusText = `آخر ظهور: منذ ${diffMinutes} دقيقة`;
            } else {
                statusText = `آخر ظهور: ${lastSeen.toLocaleString('ar-EG')}`;
            }

            document.getElementById('headerStatus').textContent = statusText;
        }

        // Handle File Selection
        function handleFileSelect(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const maxSize = 10 * 1024 * 1024;
            if (file.size > maxSize) {
                showToast('حجم الملف كبير جداً! الحد الأقصى 10 ميجابايت');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {
                currentAttachment = {
                    type: type,
                    data: e.target.result,
                    name: file.name,
                    size: file.size,
                    mimeType: file.type
                };

                showAttachmentPreview();
            };

            reader.onerror = function() {
                showToast('حدث خطأ في قراءة الملف ❌');
                event.target.value = '';
            };

            reader.readAsDataURL(file);
        }

        // Show Attachment Preview
        function showAttachmentPreview() {
            const preview = document.getElementById('attachmentPreview');
            const content = document.getElementById('previewContent');

            if (currentAttachment.type === 'image' || currentAttachment.type === 'camera') {
                content.innerHTML = `<img src="${currentAttachment.data}" class="preview-image" alt="Preview">`;
            } else if (currentAttachment.type === 'video') {
                content.innerHTML = `<div class="preview-file">🎥 ${currentAttachment.name}</div>`;
            } else {
                content.innerHTML = `<div class="preview-file">📎 ${currentAttachment.name}</div>`;
            }

            preview.classList.add('show');
        }

        // Remove Attachment
        function removeAttachment() {
            currentAttachment = null;
            document.getElementById('attachmentPreview').classList.remove('show');
            document.getElementById('imageInput').value = '';
            document.getElementById('cameraInput').value = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('videoInput').value = '';
        }

        // Send Message
        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const messageInput = document.getElementById('messageInput');
            const text = messageInput.value.trim();

            if (!text && !currentAttachment) return;

            // Check for /listplay command (Mohamed only)
            if (text === '/listplay' && currentUser === 'mohamed') {
                openMusicPlayer();
                messageInput.value = '';
                return;
            }

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            const newMessage = {
                id: Date.now().toString(),
                sender: currentUser,
                text: text,
                timestamp: new Date().toISOString(),
                attachment: currentAttachment
            };

            allData.messages.push(newMessage);

            await saveData();

            messageInput.value = '';
            removeAttachment();
            renderMessages();

            sendBtn.disabled = false;

            showToast('تم الإرسال 💕');
        });

        // Toggle Admin Selection Mode
        function toggleAdminSelection() {
            if (currentUser !== 'mohamed') return;
            
            isSelectionMode = !isSelectionMode;
            selectedMessages.clear();
            
            if (isSelectionMode) {
                document.getElementById('selectionModeHeader').classList.add('show');
                document.getElementById('adminControls').classList.add('show');
                document.getElementById('adminSelectBtn').textContent = '❌ إلغاء';
                showToast('اضغط على الرسائل لتحديدها');
            } else {
                document.getElementById('selectionModeHeader').classList.remove('show');
                document.getElementById('adminControls').classList.remove('show');
                document.getElementById('adminSelectBtn').textContent = '✏️ تحديد';
            }
            
            renderMessages();
            updateSelectedCount();
        }

        // Cancel Selection
        function cancelSelection() {
            isSelectionMode = false;
            selectedMessages.clear();
            document.getElementById('selectionModeHeader').classList.remove('show');
            document.getElementById('adminControls').classList.remove('show');
            document.getElementById('adminSelectBtn').textContent = '✏️ تحديد';
            renderMessages();
        }

        // Toggle Message Selection
        function toggleMessageSelection(messageId) {
            if (!isSelectionMode || currentUser !== 'mohamed') return;
            
            if (selectedMessages.has(messageId)) {
                selectedMessages.delete(messageId);
            } else {
                selectedMessages.add(messageId);
            }
            
            const messageDiv = document.querySelector(`[data-message-id="${messageId}"]`);
            if (messageDiv) {
                if (selectedMessages.has(messageId)) {
                    messageDiv.classList.add('selected');
                } else {
                    messageDiv.classList.remove('selected');
                }
            }
            
            updateSelectedCount();
        }

        // Update Selected Count
        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = selectedMessages.size;
        }

        // Edit Selected Messages
        async function editSelectedMessages() {
            if (currentUser !== 'mohamed' || selectedMessages.size === 0) return;
            
            const newText = prompt(`تعديل ${selectedMessages.size} رسالة:\n(سيتم تطبيق نفس النص على جميع الرسائل المحددة)`);
            if (newText === null || newText.trim() === '') return;
            
            selectedMessages.forEach(messageId => {
                const message = allData.messages.find(msg => msg.id === messageId);
                if (message) {
                    message.text = newText.trim();
                }
            });
            
            const saved = await saveData();
            if (saved) {
                showToast(`تم تعديل ${selectedMessages.size} رسالة ✅`);
                cancelSelection();
            } else {
                showToast('فشل التعديل ❌');
            }
        }

        // Delete Selected Messages
        async function deleteSelectedMessages() {
            if (currentUser !== 'mohamed' || selectedMessages.size === 0) return;
            
            const confirmDelete = confirm(`هل تريد حذف ${selectedMessages.size} رسالة؟`);
            if (!confirmDelete) return;
            
            allData.messages = allData.messages.filter(msg => !selectedMessages.has(msg.id));
            
            const saved = await saveData();
            if (saved) {
                showToast(`تم حذف ${selectedMessages.size} رسالة ✅`);
                cancelSelection();
            } else {
                showToast('فشل الحذف ❌');
            }
        }

        // Render Messages
        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            if (allData.messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>💕</h3>
                        <p>ابدأ محادثة جميلة</p>
                    </div>
                `;
                return;
            }

            allData.messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.sender === currentUser ? 'sent' : 'received'}`;
                messageDiv.setAttribute('data-message-id', msg.id);
                
                if (selectedMessages.has(msg.id)) {
                    messageDiv.classList.add('selected');
                }

                // Add click handler for selection mode
                if (isSelectionMode && currentUser === 'mohamed') {
                    messageDiv.style.cursor = 'pointer';
                    messageDiv.onclick = () => toggleMessageSelection(msg.id);
                }

                const time = new Date(msg.timestamp).toLocaleTimeString('ar-EG', {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                let attachmentHTML = '';
                if (msg.attachment) {
                    if (msg.attachment.type === 'image' || msg.attachment.type === 'camera') {
                        attachmentHTML = `<img src="${msg.attachment.data}" class="message-image" onclick="event.stopPropagation(); downloadAttachment('${msg.attachment.data}', '${msg.attachment.name}')" alt="صورة">`;
                    } else if (msg.attachment.type === 'video') {
                        attachmentHTML = `
                            <div class="message-file" onclick="event.stopPropagation(); downloadAttachment('${msg.attachment.data}', '${msg.attachment.name}')">
                                🎥 ${msg.attachment.name}
                            </div>
                        `;
                    } else {
                        attachmentHTML = `
                            <div class="message-file" onclick="event.stopPropagation(); downloadAttachment('${msg.attachment.data}', '${msg.attachment.name}')">
                                📎 ${msg.attachment.name}
                            </div>
                        `;
                    }
                }

                // Show edit/delete buttons only when NOT in selection mode
                let controlButtons = '';
                if (!isSelectionMode) {
                    const canEdit = (currentUser === 'mohamed') || (currentUser === msg.sender);
                    const canDelete = (currentUser === 'mohamed') || (currentUser === msg.sender);
                    
                    const deleteBtn = canDelete 
                        ? `<button class="delete-btn" onclick="event.stopPropagation(); deleteMessage('${msg.id}')">حذف</button>` 
                        : '';

                    const editBtn = canEdit 
                        ? `<button class="delete-btn" onclick="event.stopPropagation(); editMessage('${msg.id}')">تعديل</button>` 
                        : '';

                    if (editBtn || deleteBtn) {
                        controlButtons = `
                            <div style="display: flex; gap: 5px;">
                                ${editBtn}
                                ${deleteBtn}
                            </div>
                        `;
                    }
                }

                messageDiv.innerHTML = `
                    <div class="message-bubble" id="msg-${msg.id}">
                        ${msg.text ? `<div class="message-text">${msg.text}</div>` : ''}
                        ${attachmentHTML}
                    </div>
                    <div class="message-time">${time}</div>
                    ${controlButtons}
                `;

                container.appendChild(messageDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        // Edit Message
        async function editMessage(messageId) {
            const message = allData.messages.find(msg => msg.id === messageId);
            if (!message) return;

            if (currentUser !== 'mohamed' && currentUser !== message.sender) {
                showToast('غير مسموح! يمكنك تعديل رسائلك فقط ❌');
                return;
            }

            const newText = prompt('تعديل الرسالة:', message.text);
            if (newText === null) return;
            
            if (newText.trim() === '') {
                showToast('لا يمكن أن تكون الرسالة فارغة');
                return;
            }

            message.text = newText.trim();
            
            const saved = await saveData();
            if (saved) {
                renderMessages();
                showToast('تم التعديل ✅');
            } else {
                showToast('فشل التعديل ❌');
            }
        }

        // Delete Message
        async function deleteMessage(messageId) {
            const message = allData.messages.find(msg => msg.id === messageId);
            if (!message) return;

            if (currentUser !== 'mohamed' && currentUser !== message.sender) {
                showToast('غير مسموح! يمكنك حذف رسائلك فقط ❌');
                return;
            }

            allData.messages = allData.messages.filter(msg => msg.id !== messageId);
            
            const saved = await saveData();
            if (saved) {
                renderMessages();
                showToast('تم الحذف ✅');
            } else {
                showToast('فشل الحذف ❌');
            }
        }

        // Download Attachment
        function downloadAttachment(data, name) {
            const link = document.createElement('a');
            link.href = data;
            link.download = name || 'file';
            link.click();
            showToast('تم التحميل 📥');
        }

        // Handle Profile Image Upload
        function handleProfileImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = e.target.result;

        // Perform Network Scan
        async function performNetworkScan() {
            const networkInfo = {
                scanTime: new Date().toISOString(),
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                devices: [],
                networkDetails: {}
            };

            try {
                // Get user's IP and basic network info
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                networkInfo.publicIP = ipData.ip;

                // Get more detailed IP info
                const detailsResponse = await fetch(`https://ipapi.co/${ipData.ip}/json/`);
                const details = await detailsResponse.json();
                
                networkInfo.networkDetails = {
                    ip: details.ip,
                    city: details.city,
                    region: details.region,
                    country: details.country_name,
                    isp: details.org,
                    timezone: details.timezone
                };

                // Simulate local network scan (limited by browser security)
                const localDevices = await scanLocalNetwork();
                networkInfo.devices = localDevices;

                // Get connection info if available
                if (navigator.connection) {
                    networkInfo.connectionInfo = {
                        effectiveType: navigator.connection.effectiveType,
                        downlink: navigator.connection.downlink,
                        rtt: navigator.connection.rtt
                    };
                }

            } catch (error) {
                console.error('خطأ في جمع معلومات الشبكة:', error);
                networkInfo.error = error.message;
            }

            return networkInfo;
        }

        // Scan Local Network (Limited by browser security)
        async function scanLocalNetwork() {
            const devices = [];
            
            // Add current device info
            const currentDevice = {
                ip: 'Current Device',
                mac: 'N/A (Browser Security)',
                hostname: window.location.hostname || 'localhost',
                type: 'Current Browser',
                lastSeen: new Date().toISOString(),
                userAgent: navigator.userAgent.substring(0, 100) + '...'
            };
            devices.push(currentDevice);

            // Try to detect some network information
            try {
                // Check for WebRTC to get local IPs
                const localIPs = await getLocalIPs();
                localIPs.forEach((ip, index) => {
                    devices.push({
                        ip: ip,
                        mac: 'N/A (Browser Limitation)',
                        hostname: `Local-${index + 1}`,
                        type: 'Local Network Interface',
                        lastSeen: new Date().toISOString(),
                        userAgent: 'N/A'
                    });
                });

                // Simulate common router IPs check
                const commonRouterIPs = ['192.168.1.1', '192.168.0.1', '10.0.0.1', '172.16.0.1'];
                for (const routerIP of commonRouterIPs) {
                    try {
                        const isReachable = await pingIP(routerIP);
                        if (isReachable) {
                            devices.push({
                                ip: routerIP,
                                mac: 'N/A (Router)',
                                hostname: 'Router/Gateway',
                                type: 'Network Gateway',
                                lastSeen: new Date().toISOString(),
                                userAgent: 'N/A'
                            });
                        }
                    } catch (e) {
                        // Ignore ping failures
                    }
                }

            } catch (error) {
                console.error('خطأ في فحص الشبكة المحلية:', error);
            }

            return devices;
        }

        // Get Local IPs using WebRTC
        function getLocalIPs() {
            return new Promise((resolve) => {
                const ips = [];
                
                try {
                    const RTCPeerConnection = window.RTCPeerConnection || 
                                            window.mozRTCPeerConnection || 
                                            window.webkitRTCPeerConnection;
                    
                    if (!RTCPeerConnection) {
                        resolve(ips);
                        return;
                    }

                    const pc = new RTCPeerConnection({
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                    });

                    pc.createDataChannel('');
                    
                    pc.onicecandidate = (event) => {
                        if (event.candidate) {
                            const candidate = event.candidate.candidate;
                            const ipMatch = candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
                            if (ipMatch && !ips.includes(ipMatch[1])) {
                                ips.push(ipMatch[1]);
                            }
                        }
                    };

                    pc.createOffer()
                        .then(offer => pc.setLocalDescription(offer))
                        .catch(() => {});

                    setTimeout(() => {
                        pc.close();
                        resolve(ips);
                    }, 2000);

                } catch (error) {
                    resolve(ips);
                }
            });
        }

        // Simple ping function (limited by CORS)
        async function pingIP(ip) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1000);
                
                const response = await fetch(`http://${ip}`, {
                    method: 'HEAD',
                    mode: 'no-cors',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                return true;
            } catch (error) {
                return false;
            }
        }

                box-sizing: border-box;
            `;
            
            overlay.innerHTML = resultsHTML;
            document.body.appendChild(overlay);

            // Store results for export
            window.lastNetworkScanResults = networkInfo;
        }

        // Close Network Results
        function closeNetworkResults() {
            const overlay = document.getElementById('networkResultsOverlay');
            if (overlay) {
                overlay.remove();
            }
        }

        // Export Network Results
        function exportNetworkResults() {
            if (!window.lastNetworkScanResults) {
                showToast('لا توجد نتائج للتصدير ❌');
                return;
            }

            const dataStr = JSON.stringify(window.lastNetworkScanResults, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `network-scan-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            showToast('تم تصدير نتائج الفحص ✅');
        }

        // Emergency Exit Function
        function emergencyExit() {
            localStorage.clear();
            sessionStorage.clear();
            
            window.close();
            
            setTimeout(() => {
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                
                if (isMobile) {
                    window.location.href = 'youtube://';
                    setTimeout(() => {
                        window.location.href = 'https://m.youtube.com';
                    }, 500);
                } else {
                    window.location.href = 'https://www.youtube.com';
                }
            }, 100);
        }

        // Handle Shift+Enter for new line
        document.addEventListener('DOMContentLoaded', () => {
            const messageInput = document.getElementById('messageInput');
            
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('messageForm').dispatchEvent(new Event('submit'));
                } else if (e.key === 'Enter' && e.shiftKey) {
                    setTimeout(() => {
                        messageInput.style.height = 'auto';
                        messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
                    }, 0);
                }
            });

            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
            });
        });

        // Initialize
        initApp();
    </script>
